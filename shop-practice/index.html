<body>
    <header class="bg-red-50 py-[15px] px-[50px] border mx-40 my-7 rounded-xl flex justify-between " >

        <h1 class="font-mono text-[30px] text-blue-500">
            Shop manger

        <p>Découvrez notre catalogue de produits</p> 
        </div>
        <nav>
           <ul class="flex gap-6">

           <li> <button id="open-cart" >Carte </button></li>                           
           </ul>
        </nav>

<div id="cart-dialog"
     class="hidden fixed inset-0 z-50 bg-black/50 items-center justify-center p-5">

    <div class="bg-red-50 border rounded-xl w-full max-w-4xl max-h-[85vh] overflow-y-auto p-7 font-mono">

       
        <div class="flex justify-between items-center mb-6">
            <div>
                <h2 class="text-[25px] font-bold text-blue-500">My Cart</h2>
                <p>Découvrez vos produits sélectionnés</p>
            </div>

            <button id="close-cart" class="text-red-600 text-2xl">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        
        <section id="product-carte" class="flex flex-col gap-5">
        </section>

        
        <div class="border-t mt-6 pt-5 flex justify-between items-center">
            <div>
                <p class="text-gray-600">Total</p>
                <h3 id="cart-total" class="text-2xl font-bold">0 $</h3>
            </div>

          <div class="flex justify-end gap-3 mt-5">
          <button id="closeCart" class="border rounded-xl bg-blue-200 px-4 py-2"> Vider le panier </button>
         <button id="reservation" class="border rounded-xl bg-blue-200 px-4 py-2"> Reservation</button>
        </div>
        </div>

    </div>
</div>

<div id="diolog"  class="hidden fixed inset-0 z-50 bg-black/50 items-center justify-center p-5">
    <div id="form" class="bg-red-50 border rounded-xl w-full max-w-4xl max-h-[85vh] overflow-y-auto p-7 font-mono">
        <h2 class="text-2xl font-bold text-blue-500 mb-2">Informations personnelles</h2>
        <p class="text-gray-500 mb-6"> Remplissez vos informations pour confirmer votre réservation.</p>
        <form  id="forme" class="flex flex-col gap-4">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <input type="text" name="nam" placeholder="Name"  class="border border-gray-300 rounded-lg p-3 w-full ">
            <input type="email" name="email" placeholder="Email" class="border border-gray-300 rounded-lg p-3 w-full">
            <input type="text" name="adresse" placeholder="Adresse" class="border border-gray-300 rounded-lg p-3 w-full">
            <input type="text" name="ville" placeholder="Ville" class="border border-gray-300 rounded-lg p-3 w-full">
             <input type="number" name="téléphone" placeholder="Téléphone" class="border border-gray-300 rounded-lg p-3 w-full">
             <input type="number" name="code postal." placeholder="Code Postal" class="border border-gray-300 rounded-lg p-3 w-full">
             <input type="text" name="note" placeholder="Note" class="border border-gray-300 rounded-lg p-3 w-full">
             </div>
             <div class="flex justify-end gap-3 mt-3">

                <button type="button" id="Annuler" class="border border-gray-300 rounded-lg px-5 py-2"> Annuler </button>
                <button type="submit" id="Confirmer"  class="bg-blue-200 rounded-lg px-5 py-2 ">  Confirmer </button>
            </div>

        </form>
    
</div>
</div>



    <main  class="bg-red-50 py-[15px] px-[50px] border mx-40 my-7 rounded-xl">
        <section class="flex mb-6">
            <input type="search" name="serch" id="serch" placeholder="Search products" class=" border border-black w-full rounded-lg py-3 px-2">
        </section>
        <section class="flex gap-10  mb-6">
            <select name="categorie" id="category" class="w-1/4 border border-black rounded-lg py-2 px-2">
                <option value="" selected disabled>choisir category</option>
                <!-- <option value="">Books</option>

                <option value="">Outdoor</option> -->
            </select>
            <div class="flex gap-5 w-full items-center">
           
            <input type="number" name="max price" id="max-price" placeholder="max price" class="w-1/2 border border-black rounded-lg py-2 px-2">
             <label><input type="checkbox" id="in-stock" class="w-[60px] ">in Stock</label>
             <button id="reset-filters" class=" border border-black rounded-lg py-2 px-2 bg-blue-200 "> Réinitialiser les filtres</button>


            </div>
        </section>
        <section id="product-container" class=" flex gap-10 font-mono  w-full flex-wrap ">

                <button class="border rounded-lg w-full bg-blue-200">Add Product</button>
            </div>
             </div>
